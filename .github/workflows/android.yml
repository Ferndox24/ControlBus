name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17



    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"



    - name: Dependencies
      run: |

        sudo apt update

        sudo apt install -y \
        git \
        zip \
        unzip \
        autoconf \
        libtool \
        pkg-config \
        cmake \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev



    - name: Install Buildozer
      run: |

        pip install --upgrade pip

        pip install buildozer==1.5.0

        pip install cython==0.29.37



    - name: Prepare Buildozer
      run: |

        mkdir -p ~/.buildozer/android/platform


        export SDK=$HOME/.buildozer/android/platform/android-sdk


        mkdir -p $SDK/cmdline-tools


        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip


        unzip commandlinetools-linux-11076708_latest.zip \
        -d $SDK/cmdline-tools


        mv $SDK/cmdline-tools/cmdline-tools \
        $SDK/cmdline-tools/latest



        echo "ANDROIDSDK=$SDK" >> $GITHUB_ENV

        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV

        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV


        echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH



    - name: Install Android packages
      run: |

        yes | sdkmanager --licenses || true


        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"



    - name: Build
      run: |

        rm -rf .buildozer


        buildozer -v android debug



    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: ControlBus-apk

        path: bin/*.apk
