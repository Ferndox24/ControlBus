name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"



    - name: Dependencies
      run: |

        sudo apt update

        sudo apt install -y \
        git \
        unzip \
        wget \
        zip \
        autoconf \
        libtool \
        pkg-config \
        cmake \
        zlib1g-dev \
        libncurses5-dev



    - name: Install Buildozer
      run: |

        pip install --upgrade pip

        pip install buildozer

        pip install cython==0.29.37



    - name: Android SDK
      run: |

        mkdir -p /home/runner/android-sdk/cmdline-tools


        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip


        unzip commandlinetools-linux-11076708_latest.zip \
        -d /home/runner/android-sdk/cmdline-tools


        mkdir -p /home/runner/android-sdk/cmdline-tools/latest


        mv /home/runner/android-sdk/cmdline-tools/cmdline-tools/* \
        /home/runner/android-sdk/cmdline-tools/latest/



        echo "ANDROID_HOME=/home/runner/android-sdk" >> $GITHUB_ENV

        echo "ANDROID_SDK_ROOT=/home/runner/android-sdk" >> $GITHUB_ENV


        echo "/home/runner/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

        echo "/home/runner/android-sdk/platform-tools" >> $GITHUB_PATH



    - name: Verify SDK
      run: |

        which sdkmanager

        sdkmanager --version



    - name: Install SDK packages
      run: |

        yes | sdkmanager --licenses


        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"



    - name: Force Buildozer SDK
      run: |

        mkdir -p ~/.buildozer/android/platform


        ln -s /home/runner/android-sdk \
        ~/.buildozer/android/platform/android-sdk



    - name: Clean
      run: |

        rm -rf .buildozer



    - name: Build APK
      run: |

        buildozer -v android debug



    - name: Upload
      uses: actions/upload-artifact@v4
      with:

        name: ControlBus-apk

        path: bin/*.apk
