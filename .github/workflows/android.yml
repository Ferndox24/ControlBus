- name: Instalar dependencias Android
  run: |

    sudo apt update

    sudo apt install -y \
      python3-pip \
      openjdk-17-jdk \
      unzip \
      zip \
      autoconf \
      libtool \
      pkg-config \
      zlib1g-dev \
      libncurses5-dev \
      libncursesw5-dev \
      cmake


    yes | sdkmanager --licenses || true

        path: bin/*.apk
