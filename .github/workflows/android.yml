name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          git \
          unzip \
          zip \
          wget \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev



    - name: Install Buildozer
      run: |

        python -m pip install --upgrade pip

        pip install buildozer

        pip install cython==0.29.37



    - name: Install Android SDK
      run: |

        mkdir -p /home/runner/android-sdk/cmdline-tools


        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip


        unzip commandlinetools-linux-11076708_latest.zip \
        -d /home/runner/android-sdk/cmdline-tools


        mkdir -p /home/runner/android-sdk/cmdline-tools/latest


        mv /home/runner/android-sdk/cmdline-tools/cmdline-tools/* \
        /home/runner/android-sdk/cmdline-tools/latest/


        echo "ANDROID_HOME=/home/runner/android-sdk" >> $GITHUB_ENV

        echo "ANDROID_SDK_ROOT=/home/runner/android-sdk" >> $GITHUB_ENV


        echo "/home/runner/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

        echo "/home/runner/android-sdk/platform-tools" >> $GITHUB_PATH



    - name: Check sdkmanager
      run: |

        which sdkmanager

        sdkmanager --version



    - name: Accept Android licenses
      run: |

        yes | sdkmanager --licenses



    - name: Install Android packages
      run: |

        sdkmanager \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0"



    - name: Prepare Buildozer SDK path
      run: |

        rm -rf /home/runner/.buildozer/android/platform/android-sdk


        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin


        ln -s \
        /home/runner/android-sdk/cmdline-tools/latest/bin/sdkmanager \
        /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager


        ln -s \
        /home/runner/android-sdk/build-tools \
        /home/runner/.buildozer/android/platform/android-sdk/build-tools


        ln -s \
        /home/runner/android-sdk/platforms \
        /home/runner/.buildozer/android/platform/android-sdk/platforms


        ln -s \
        /home/runner/android-sdk/platform-tools \
        /home/runner/.buildozer/android/platform/android-sdk/platform-tools



    - name: Verify Buildozer SDK
      run: |

        ls -la /home/runner/.buildozer/android/platform/android-sdk/tools/bin

        /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --version



    - name: Clean previous build
      run: |

        rm -rf .buildozer



    - name: Build APK
      run: |

        buildozer -v android debug



    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: ControlBus-apk

        path: bin/*.apk
