name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          git \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev


    - name: Install Buildozer
      run: |

        pip install --upgrade pip

        pip install buildozer

        pip install cython==0.29.37



    - name: Android SDK
      run: |

        mkdir -p $HOME/android-sdk/cmdline-tools


        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip


        unzip commandlinetools-linux-11076708_latest.zip \
        -d $HOME/android-sdk/cmdline-tools


        mv $HOME/android-sdk/cmdline-tools/cmdline-tools \
        $HOME/android-sdk/cmdline-tools/latest



        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH



    - name: Install SDK packages
      run: |

        yes | sdkmanager --licenses || true


        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"


        echo "SDK:"
        ls $ANDROID_HOME/build-tools



    - name: Configure Buildozer environment
      run: |

        echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV

        echo "ANDROIDAPI=35" >> $GITHUB_ENV

        echo "ANDROIDMINAPI=23" >> $GITHUB_ENV

        echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV



    - name: Clean
      run: |

        rm -rf .buildozer



    - name: Build APK
      run: |

        buildozer -v android debug



    - name: Upload
      uses: actions/upload-artifact@v4
      with:

        name: ControlBus-apk

        path: bin/*.apk
