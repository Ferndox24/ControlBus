name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install packages
      run: |

        sudo apt update

        sudo apt install -y \
        git \
        zip \
        unzip \
        autoconf \
        libtool \
        pkg-config \
        cmake \
        zlib1g-dev \
        libncurses5-dev \
        libncursesw5-dev


    - name: Install Buildozer fixed version
      run: |

        pip install --upgrade pip

        pip install buildozer==1.5.0

        pip install cython==0.29.37

        pip install python-for-android==2024.1.21



    - name: Install Android SDK
      run: |

        mkdir -p $HOME/android-sdk/cmdline-tools

        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

        unzip commandlinetools-linux-11076708_latest.zip \
        -d $HOME/android-sdk/cmdline-tools


        mv $HOME/android-sdk/cmdline-tools/cmdline-tools \
        $HOME/android-sdk/cmdline-tools/latest


        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV

        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV


        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH



    - name: Install SDK
      run: |

        yes | sdkmanager --licenses


        sdkmanager \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"



    - name: Environment
      run: |

        echo "ANDROIDSDK=$HOME/android-sdk" >> $GITHUB_ENV

        echo "ANDROIDAPI=35" >> $GITHUB_ENV

        echo "ANDROIDMINAPI=23" >> $GITHUB_ENV

        echo "ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV



    - name: Clean
      run: |

        rm -rf ~/.buildozer
        rm -rf .buildozer



    - name: Build
      run: |

        buildozer -v android debug



    - name: Upload
      uses: actions/upload-artifact@v4
      with:

        name: ControlBus-apk

        path: bin/*.apk
