name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake

      - name: Install Python packages
        run: |
          python -m pip install --upgrade "pip<24"
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.37

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Download Android Command Line Tools
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk

          cd /tmp

          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip

          unzip -q commandlinetools-linux-9477386_latest.zip

          mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest

          cp -r cmdline-tools/* \
            $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/

          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin

          ln -sf \
          $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager \
          $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

          ln -sf \
          $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager \
          $HOME/.buildozer/android/platform/android-sdk/tools/bin/avdmanager

      - name: Configure Environment
        run: |
          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

          echo "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/.buildozer/android/platform/android-sdk/tools/bin" >> $GITHUB_PATH
          echo "$HOME/.buildozer/android/platform/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Verify SDK
        run: |
          which sdkmanager
          sdkmanager --version

      - name: Accept Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Show installed SDK
        run: |
          ls -R $ANDROIDSDK

      - name: Show versions
        run: |
          python --version
          python -m pip --version
          buildozer --version

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlBus-apk
          path: bin/*.apk
