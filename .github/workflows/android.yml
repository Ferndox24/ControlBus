name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout repository
      uses: actions/checkout@v4



    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"



    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          git \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev



    - name: Install Buildozer
      run: |

        python -m pip install --upgrade pip

        pip install buildozer==1.5.0

        pip install cython==0.29.37



    - name: Prepare Android SDK for Buildozer
      run: |

        mkdir -p ~/.buildozer/android/platform


        export SDK=$HOME/.buildozer/android/platform/android-sdk


        mkdir -p $SDK


        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip


        unzip commandlinetools-linux-9477386_latest.zip -d $SDK



        mkdir -p $SDK/cmdline-tools/latest


        mv $SDK/cmdline-tools/cmdline-tools/* \
        $SDK/cmdline-tools/latest/



        mkdir -p $SDK/tools/bin



        ln -s \
        $SDK/cmdline-tools/latest/bin/sdkmanager \
        $SDK/tools/bin/sdkmanager



        echo "ANDROIDSDK=$SDK" >> $GITHUB_ENV

        echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV

        echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV



        echo "$SDK/tools/bin" >> $GITHUB_PATH

        echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH



    - name: Install Android packages
      run: |

        yes | sdkmanager --licenses || true


        sdkmanager \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0"



    - name: Set Android variables
      run: |

        echo "ANDROIDAPI=35" >> $GITHUB_ENV

        echo "ANDROIDMINAPI=23" >> $GITHUB_ENV



    - name: Clean old Buildozer files
      run: |

        rm -rf .buildozer

        rm -rf ~/.buildozer/android/platform/build-*



    - name: Build APK
      run: |

        buildozer -v android debug



    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:

        name: ControlBus-apk

        path: bin/*.apk
